# Compilar APK — Aurora Music Player
#
# Compila la app sin Gradle (el repositorio es un proyecto de AIDE) usando
# solo las herramientas del SDK de Android, con el mismo orden que sigue
# AIDE: aapt2 → javac → d8 → zipalign → apksigner. Ver tools/build-apk.sh.
#
# ¿Y las arquitecturas? La app no tiene ni una línea de código nativo: no
# hay .so, ni NDK, ni jniLibs. El WebView, el MediaPlayer y el resto vienen
# del sistema, así que UNA sola APK funciona igual en arm64-v8a,
# armeabi-v7a, x86 y x86_64. Lo que sí cambia de un móvil a otro es la
# versión de Android, así que la matriz compila una APK por tramo de API:
#
#   · minSdk 21 — todas las arquitecturas, Android 5.0 o superior (universal)
#   · minSdk 26 — Android 8.0 o superior (canal de notificación nativo)
#   · minSdk 33 — Android 13 o superior (permiso de notificaciones)
#
# Las tres APK quedan como artefactos del workflow, firmadas con una clave
# de depuración, listas para instalar y probar en el móvil.

name: Compilar APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Solo para poder publicar el fallo de la compilación donde se lea:
  # las anotaciones del runner y un comentario en el PR.
  checks: write
  pull-requests: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK (minSdk ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [21, 26, 33]

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Comprobaciones del proyecto
        run: python3 tools/check.py

      - name: Preparar el SDK de Android
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "No hay SDK en el runner; se instala."
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            echo "Falta sdkmanager en $SDK" >&2
            exit 1
          fi
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Compilar
        run: |
          set -uo pipefail
          mkdir -p dist
          LOG="$RUNNER_TEMP/build.log"
          # bash -x deja en el log la orden exacta que falló, no solo el
          # mensaje del tool: con el log del runner a veces no basta.
          bash -x tools/build-apk.sh \
            --min-sdk ${{ matrix.api }} \
            --target-sdk 33 \
            --out "dist/aurora-minSdk${{ matrix.api }}.apk" >"$LOG" 2>&1
          status=$?
          tail -n 60 "$LOG" || true
          if [ "$status" -ne 0 ]; then
            # El log del runner no siempre es accesible desde fuera (y el
            # almacenamiento de artefactos, menos). Las anotaciones sí se
            # leen por API, así que el error viaja ahí: una sola ejecución
            # dice qué herramienta falló y por qué.
            esc() { sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%s", sep, $0; sep="%0A"}'; }
            echo "::error title=build-apk.sh falló (minSdk ${{ matrix.api }})::$(tail -n 45 "$LOG" | esc | head -c 3000)"
            if [ -f build/apk/javac.log ]; then
              echo "::error title=javac.log::$(head -c 2500 build/apk/javac.log | esc)"
            fi
            echo "::error title=Entorno::$( { echo "ANDROID_HOME=$ANDROID_HOME"; java -version 2>&1 | head -2; ls "$ANDROID_HOME/build-tools" 2>&1; ls "$ANDROID_HOME/platforms" 2>&1; } | esc | head -c 2000)"
            # Y además, un comentario en el PR: es el único sitio donde el
            # fallo se puede leer sin abrir la pestaña del runner.
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              {
                echo "**La compilación falló (minSdk ${{ matrix.api }}, commit \`${GITHUB_SHA:0:7}\`).** Últimas líneas:"
                echo
                echo '```'
                tail -n 45 "$LOG"
                echo '```'
                echo 'Entorno:'
                echo '```'
                echo "ANDROID_HOME=$ANDROID_HOME"
                java -version 2>&1 | head -2
                ls "$ANDROID_HOME/build-tools" 2>&1
                ls "$ANDROID_HOME/platforms" 2>&1
                echo '```'
              } > "$RUNNER_TEMP/comment.md" || true
              GH_TOKEN="${{ github.token }}" gh pr comment ${{ github.event.pull_request.number }} \
                --body-file "$RUNNER_TEMP/comment.md" || true
            fi
            exit "$status"
          fi

      - name: Resumen
        run: |
          {
            echo "### Aurora · minSdk ${{ matrix.api }}"
            echo
            echo '```'
            ls -lh dist/
            echo '```'
            echo
            echo "Detalles de la compilación en el log del paso «Compilar»."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: aurora-minSdk${{ matrix.api }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  cobertura:
    name: Cobertura de la APK
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - name: Descargar la APK universal
        uses: actions/download-artifact@v4
        with:
          name: aurora-minSdk21
          path: dist

      - name: Analizar la APK
        run: |
          set -euo pipefail
          APK="$(ls dist/*.apk | head -1)"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

          python3 - "$APK" <<'PY'
          import sys, zipfile, collections

          apk = sys.argv[1]
          z = zipfile.ZipFile(apk)
          names = z.namelist()

          # 1) Lo que hace falta para que sea instalable y arranque
          obligatorios = ["AndroidManifest.xml", "resources.arsc", "classes.dex",
                          "assets/www/index.html", "assets/www/js/main.js"]
          faltan = [n for n in obligatorios if n not in names]
          if faltan:
              sys.exit("faltan en la APK: " + ", ".join(faltan))

          # 2) Código nativo: si no hay lib/, una sola APK sirve para todas las ABIs
          nativas = [n for n in names if n.startswith("lib/") or n.endswith(".so")]
          if nativas:
              sys.exit("la APK lleva código nativo (%d archivos): habría que "
                       "repartir por ABI" % len(nativas))

          # 3) Recursos por densidad y por idioma (lo que de verdad varía
          #    entre dispositivos cuando no hay ABIs)
          densidades = sorted({n.split("/")[1] for n in names
                               if n.startswith("res/") and "/" in n[4:]
                               and n.split("/")[1].startswith("mipmap")})
          dexs = [n for n in names if n.endswith(".dex")]
          web = [n for n in names if n.startswith("assets/www/")]

          print()
          print("ABIs            : todas (arm64-v8a, armeabi-v7a, x86, x86_64)")
          print("                 no hay librerías nativas, el sistema pone el WebView")
          print("DEX             : " + ", ".join(dexs))
          print("Densidades      : " + (", ".join(densidades) or "solo la por defecto"))
          print("Archivos de la app web: %d" % len(web))
          print("Peso sin comprimir    : %.1f MB" % (sum(z.getinfo(n).file_size for n in names) / 1048576))

          resumen = [
              "### Cobertura de la APK universal",
              "",
              "| Qué | Valor |",
              "|---|---|",
              "| Arquitecturas | todas: sin código nativo, el WebView es del sistema |",
              "| DEX | %s |" % ", ".join(dexs),
              "| Densidades | %s |" % (", ".join(densidades) or "por defecto"),
              "| Archivos web | %d |" % len(web),
              "",
              "Una sola APK vale para cualquier móvil de Android 5.0 o superior, "
              "sea de 32 o de 64 bits.",
          ]
          import os
          paso = os.environ.get("GITHUB_STEP_SUMMARY")
          if paso:
              with open(paso, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(resumen) + "\n")
          print()
          print("OK: la APK cubre todas las arquitecturas y arranca en Android 5.0+")
          PY
