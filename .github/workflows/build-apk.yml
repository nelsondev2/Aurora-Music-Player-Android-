# Compila una única APK universal, compatible con Android 5.0 o superior.
# La app no incluye bibliotecas nativas, por lo que la misma APK funciona
# en todas las arquitecturas soportadas por Android.

name: Compilar APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK universal (Android 5.0+)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Comprobaciones del proyecto
        run: python3 tools/check.py

      - name: Preparar el SDK de Android
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "No hay SDK en el runner; se instala."
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            echo "Falta sdkmanager en $SDK" >&2
            exit 1
          fi
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-33" "build-tools;34.0.0" > /dev/null

      - name: Compilar APK Android 5+
        run: |
          set -uo pipefail
          mkdir -p dist
          LOG="$RUNNER_TEMP/build.log"
          status=0
          bash -x tools/build-apk.sh \
            --target-sdk 33 \
            --out dist/aurora-android5-plus.apk >"$LOG" 2>&1 || status=$?
          tail -n 60 "$LOG" || true
          if [ "$status" -ne 0 ]; then
            esc() { sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%s", sep, $0; sep="%0A"}'; }
            echo "::error title=Falló la compilación de la APK universal::$(tail -n 45 "$LOG" | esc | head -c 3000)"
            if [ -f build/apk/javac.log ]; then
              echo "::error title=javac.log::$(head -c 2500 build/apk/javac.log | esc)"
            fi
            echo "::error title=Entorno::$( { echo "ANDROID_HOME=$ANDROID_HOME"; java -version 2>&1 | head -2; ls "$ANDROID_HOME/build-tools" 2>&1; ls "$ANDROID_HOME/platforms" 2>&1; } | esc | head -c 2000)"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              {
                echo "**Falló la compilación de la APK universal (commit \`${GITHUB_SHA:0:7}\`).** Últimas líneas:"
                echo
                echo '```'
                tail -n 45 "$LOG"
                echo '```'
              } > "$RUNNER_TEMP/comment.md" || true
              GH_TOKEN="${{ github.token }}" gh pr comment ${{ github.event.pull_request.number }} \
                --body-file "$RUNNER_TEMP/comment.md" || true
            fi
            exit "$status"
          fi

      - name: Resumen
        run: |
          {
            echo "### APK universal · Android 5.0 o superior"
            echo
            echo '```'
            ls -lh dist/aurora-android5-plus.apk
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-android5-plus
          path: dist/aurora-android5-plus.apk
          if-no-files-found: error
          retention-days: 30

  cobertura:
    name: Verificar APK universal
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - name: Descargar APK
        uses: actions/download-artifact@v4
        with:
          name: aurora-android5-plus
          path: dist

      - name: Verificar contenido y compatibilidad
        run: |
          set -euo pipefail
          python3 - dist/aurora-android5-plus.apk <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              required = [
                  "AndroidManifest.xml",
                  "resources.arsc",
                  "classes.dex",
                  "assets/www/index.html",
                  "assets/www/js/main.js",
              ]
              missing = [name for name in required if name not in names]
              if missing:
                  sys.exit("Faltan archivos en la APK: " + ", ".join(missing))

              native = [name for name in names
                        if name.startswith("lib/") or name.endswith(".so")]
              if native:
                  sys.exit("La APK contiene librerías nativas y ya no es universal: "
                           + ", ".join(native[:10]))

              dex_files = [name for name in names if name.endswith(".dex")]
              dex_data = b"".join(archive.read(name) for name in dex_files)
              expected = [
                  b"Lcom/nelsondev2/aurora/MainActivity;",
                  b"Lcom/nelsondev2/aurora/NativeHomeActivity;",
                  b"Lcom/nelsondev2/aurora/NativeLibraryDatabase;",
                  b"Lcom/nelsondev2/aurora/NativeBackupImporter;",
                  b"Lcom/nelsondev2/aurora/NativePlayer;",
                  b"Lcom/nelsondev2/aurora/NativePlayerBridge;",
                  b"Lcom/nelsondev2/aurora/DeviceLibraryBridge;",
                  b"Lcom/nelsondev2/aurora/PlaybackService;",
                  b"Lcom/nelsondev2/aurora/ShareProvider;",
              ]
              missing_classes = [item.decode().strip("L;")
                                 for item in expected if item not in dex_data]
              if missing_classes:
                  sys.exit("El DEX no incluye: " + ", ".join(missing_classes))

              size = sum(archive.getinfo(name).file_size for name in names)
              print("APK verificada: Android 5.0+ (minSdk 21), todas las arquitecturas")
              print("Clases Java comprobadas en DEX: %d" % len(expected))
              print("Peso sin comprimir: %.1f MB" % (size / 1048576))

          summary = [
              "### APK universal verificada",
              "",
              "- Una sola APK, compatible con Android 5.0 o superior (minSdk 21).",
              "- Todas las arquitecturas: no incluye librerías nativas.",
              "- Manifiesto, recursos y clases Java comprobados dentro del APK.",
          ]
          import os
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as output:
                  output.write("\n".join(summary) + "\n")
          PY
